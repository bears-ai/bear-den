[package]
name = "den-api"
version.workspace = true
edition = "2021"

# den-api: the JSON/REST + OAuth HTTP edge of the den binary. It owns the public
# API service (`service::create_api_app`), the v1 user/profile/oauth routes, the
# OAuth2 authorization server, and the OpenAPI docs. Peer HTTP edges are injected
# by the binary composition root as peer routers, so
# this crate has no dependency on any sibling edge (ADR-0043: edges are peers). It
# shares the protocol-neutral `den_service::DenState` and sits above den-http
# (identity/error foundation), den-oauth, den-service (shared state/services),
# den-runtime (tool/runtime execution), den-docket (task and job state), and den-core.

[lints]
workspace = true

[features]
production = ["den-core/production", "den-protocol/production", "den-service/production", "den-runtime/production", "den-http/production", "den-oauth/production"]

[dependencies]
den-core = { path = "../den-core" }
den-protocol = { path = "../den-protocol" }
den-service = { path = "../den-service" }
den-memory = { path = "../den-memory" }
den-docket = { path = "../den-docket" }
den-http = { path = "../den-http" }
den-oauth = { path = "../den-oauth" }
den-runtime = { path = "../den-runtime" }
axum = { workspace = true, features = ["json", "matched-path", "ws"] }
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
uuid.workspace = true
axum-login.workspace = true
password-auth.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
time = { workspace = true, features = ["serde", "serde-well-known"] }
tower-http.workspace = true
tower-sessions-sqlx-store = { workspace = true, default-features = false }
tracing.workspace = true
utoipa.workspace = true
validator.workspace = true

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
den-runtime = { path = "../den-runtime", features = ["test-util"] }
serde_json.workspace = true
