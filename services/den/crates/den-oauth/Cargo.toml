[package]
name = "den-oauth"
version.workspace = true
edition = "2021"

# den-oauth: the OAuth 2.0 authorization server (RFC 6749 / RFC 7636) plus the
# shared bearer-auth layer (`ApiError`, `BearerPrincipal`, token extraction /
# scope checks) and the OAuth consent/authorize page rendering. It sits *below*
# the HTTP edges (den-api / den-web / den-bearwire) so all of them can depend on
# the bearer-auth primitives without a cycle. Depends only on den-http (errors/auth_backend/user) and
# den-core (config).

[lints]
workspace = true

[features]
production = ["den-core/production", "den-http/production"]

[dependencies]
den-core = { path = "../den-core" }
den-http = { path = "../den-http" }
axum = { workspace = true, features = ["json", "query", "form"] }
axum-login.workspace = true
base64.workspace = true
bytes.workspace = true
jsonwebtoken = "9.3.0"
minijinja.workspace = true
minijinja-embed.workspace = true
password-auth.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid", "macros"] }
time = { workspace = true, features = ["serde", "serde-well-known"] }
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true

[build-dependencies]
minijinja-embed.workspace = true

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
sqlx = { workspace = true, features = ["migrate"] }
tower = { workspace = true, features = ["util"] }
