[package]
name = "den-memory"
version.workspace = true
edition = "2021"

# Per-Bear canonical memory store (per-Bear SQLite), per ADR-0031.
# Service-layer leaf in the den workspace (DEN_CRATE_SPLIT_PLAN.md): depends
# only on den-core. Higher-level memory curation/tools (which reach into bears
# and reflection) stay in the den crate for now.

[lints]
workspace = true

[dependencies]
den-core = { path = "../den-core" }
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
sha2.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "sqlite", "time", "json", "uuid"] }
time = { workspace = true, features = ["serde", "serde-well-known"] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }
tracing.workspace = true
uuid.workspace = true
