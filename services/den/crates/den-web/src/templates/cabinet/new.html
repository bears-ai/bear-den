{% extends "base.html" %}
{% block title %}New Cabinet page{% endblock %}
{% block breadcrumb %}<a href="/">Bears</a> / <a href="/cabinet">Cabinet</a>{% endblock %}
{% block content %}
<p><a href="/cabinet">← Cabinet</a></p>
<h1>New Cabinet page</h1>
<form method="post" action="/cabinet/new">
    {% if parent %}<input type="hidden" name="parent" value="{{ parent | e }}"><p>New child page of <a href="/cabinet/{{ parent | e }}">the selected page</a>.</p>{% endif %}
    <p>
        <label for="title">Title</label><br>
        <input type="text" id="title" name="title" required>
    </p>
    <p>
        <label for="content">Content (Markdown)</label><br>
        <textarea id="content" name="content" rows="20" cols="100"></textarea>
    </p>
    <button type="submit">Create</button>
</form>
{% endblock %}
