[package]
name = "den-docket"
version.workspace = true
edition = "2021"

# Docket: Den's control-plane work-management subsystem (ADR-0034).
# Service-layer leaf in the den workspace (DEN_CRATE_SPLIT_PLAN.md): depends only
# on den-core and the provider-neutral Cabinet reference contract. New jobs/tasks use the relational ADR-0034 tables. Historical
# task-list tables may exist in old migrations/data, but den-docket keeps no
# active read/write shims for them.

[lints]
workspace = true

[dependencies]
den-core = { path = "../den-core" }
den-cabinet = { path = "../den-cabinet" }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid", "macros"] }
time = { workspace = true, features = ["serde", "serde-well-known"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx = { workspace = true, default-features = false, features = ["migrate"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
