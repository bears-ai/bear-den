[package]
name = "den"
version.workspace = true
edition = "2021"

[features]
production = ["den-core/production", "den-protocol/production", "den-runtime/production", "den-http/production", "den-api/production", "den-web/production", "den-bearwire/production", "den-sandbox/production"]
web-ui-fixtures = []

# Cargo workspace root. The `den` binary stays the root package; extracted
# member crates (den-core, den-llm, ...) land under `crates/` per
# docs/roadmap/DEN_CRATE_SPLIT_PLAN.md. Members are added as they are extracted.
[workspace]
resolver = "2"
members = ["crates/bearwire-protocol", "crates/den-cabinet", "crates/den-core", "crates/den-protocol", "crates/den-service", "crates/den-llm", "crates/den-memory", "crates/den-docket", "crates/den-runtime", "crates/den-http", "crates/den-oauth", "crates/den-api", "crates/den-web", "crates/den-bearwire", "crates/den-sandbox", "crates/den-repository"]

[workspace.package]
version = "0.1.2"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
async-trait = "0.1.86"
axum = { version = "0.8", default-features = false }
axum-extra = { version = "0.10.0", features = ["form", "query"] }
axum-login = "0.17.0"
base64 = "0.22"
bytes = "1"
dotenvy = "0.15.7"
futures = "0.3"
minijinja = { version = "2.5.0", features = ["loader", "preserve_order", "json"] }
minijinja-embed = "2.7.0"
password-auth = "1.0.0"
rand = "0.9.1"
regex = "1.11.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.138"
serde_yml = "0.0.12"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false }
thiserror = "2.0.12"
time = { version = "0.3.37" }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "cors"] }
tower-sessions-sqlx-store = { version = "0.15", default-features = false, features = ["postgres"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
urlencoding = "2.1"
utoipa = { version = "4.0", features = ["axum_extras"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
validator = { version = "0.20", features = ["derive"] }
zeroize = "1.9"

[lints]
workspace = true

# Gating clippy baseline (DEN_CRATE_SPLIT_PLAN.md v2): pedantic/nursery are
# `deny`, enforced by the clippy gate (scripts/lint.sh, CI). The allow-list below
# curates the opinionated/stylistic/false-positive-prone lints we intentionally
# do not enforce; everything else in both groups now gates.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Noisy / low-signal pedantic lints.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
if_not_else = "allow"
single_match_else = "allow"
match_same_arms = "allow"
unnested_or_patterns = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
uninlined_format_args = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Context/builder functions legitimately take many params; de-stringify
# (DEN_CRATE_SPLIT_PLAN v0 #4) bundles some into typed structs over time.
too_many_arguments = "allow"
# Noisy / false-positive-prone nursery lints.
option_if_let_else = "allow"
missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
redundant_pub_crate = "allow"
use_self = "allow"
cognitive_complexity = "allow"
branches_sharing_code = "allow"

# v2 gating allow-list: opinionated/stylistic lints we deliberately do not
# enforce. Each would otherwise churn signatures, restructure docs, or lose
# forward-compat for marginal value; the remainder of pedantic/nursery gates.
needless_pass_by_value = "allow"        # ownership-transfer APIs are intentional
manual_let_else = "allow"               # `match` forms are fine and clearer in places
default_trait_access = "allow"          # `Default::default()` is clear in context
items_after_statements = "allow"        # local fn/item placement is a style choice
unused_async = "allow"                  # async kept for trait/API shape consistency
unreadable_literal = "allow"            # separators add noise to IDs/test constants
unnecessary_wraps = "allow"             # uniform Result/Option signatures across a family
trivially_copy_pass_by_ref = "allow"    # by-ref kept for signature consistency
struct_field_names = "allow"            # field prefixes/suffixes aid readability
match_wildcard_for_single_variants = "allow" # `_` arms are deliberate forward-compat
ref_option = "allow"                    # `&Option<T>` is fine at these call sites
unused_self = "allow"                   # method form kept for API consistency
single_option_map = "allow"            # low-signal nursery style lint
many_single_char_names = "allow"        # terse locals in metric aggregation
case_sensitive_file_extension_comparisons = "allow"
format_push_string = "allow"            # `push_str(&format!(..))` reads clearly
used_underscore_binding = "allow"
used_underscore_items = "allow"
pub_underscore_fields = "allow"
too_long_first_doc_paragraph = "allow"  # doc-prose shape is an author choice
needless_for_each = "allow"             # macro-expansion false positive (utoipa)
needless_pass_by_ref_mut = "allow"      # `&mut self` kept for API symmetry
useless_let_if_seq = "allow"            # imperative let/if reads clearly in places
needless_collect = "allow"              # explicit intermediates aid readability in tests
# Native async fn in trait (see traits v2 change) intentionally yields non-Send
# futures consumed in single-threaded contexts; real spawn-Send violations still
# surface as hard compile errors at the spawn site.
future_not_send = "allow"
# Fires inside sqlx macro expansions (`sqlx::migrate!` embeds all migration
# files) and grows with every migration, so it is noise here.
large_stack_arrays = "allow"

[profile.dev]
# Optimize for faster linking in development
debug = 1          # Reduce debug info (0 = none, 1 = line tables, 2 = full)
incremental = true # Enable incremental compilation
codegen-units = 256 # More codegen units = faster compile, slower runtime

[profile.dev.package.sqlx-macros]
opt-level = 0

# Optimize heavy dependencies in debug builds to reduce binary size
[profile.dev.package."*"]
opt-level = 1      # Light optimization for all dependencies
debug = 0          # No debug symbols for dependencies

# Keep our own code unoptimized for debugging
[profile.dev.package.den]
opt-level = 0
debug = 2

# Fast development profile for even quicker iteration
[profile.dev-fast]
inherits = "dev"
debug = 0          # No debug info at all
opt-level = 0      # No optimization
incremental = true
codegen-units = 256

[profile.release]
# Optimize for reasonable binary speed while keeping link times practical.
# Local Docker smoke builds run on memory-constrained developer machines, so keep
# the default release profile conservative enough that the final Den crate build
# does not OOM. CI/deploy can still opt into the smaller/faster runtime profile
# below with `--profile release-lto`.
lto = false
codegen-units = 256
panic = "abort"
strip = "symbols"
debug = 0

[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16

[dependencies]
den-cabinet = { path = "crates/den-cabinet" }
den-core = { path = "crates/den-core" }
den-protocol = { path = "crates/den-protocol" }
den-service = { path = "crates/den-service" }
den-memory = { path = "crates/den-memory" }
den-docket = { path = "crates/den-docket" }
den-runtime = { path = "crates/den-runtime" }
den-http = { path = "crates/den-http" }
den-api = { path = "crates/den-api" }
den-bearwire = { path = "crates/den-bearwire" }
den-sandbox = { path = "crates/den-sandbox" }
den-web = { path = "crates/den-web" }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
axum-login.workspace = true
dotenvy.workspace = true
futures.workspace = true
password-auth.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid", "migrate"] }
thiserror.workspace = true
time = { workspace = true, features = ["serde", "serde-well-known"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tower-sessions-sqlx-store = { workspace = true, default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
den-repository = { path = "crates/den-repository", features = ["test-util"] }
secrecy.workspace = true
den-core = { path = "crates/den-core", features = ["test-util"] }
den-memory = { path = "crates/den-memory" }
den-runtime = { path = "crates/den-runtime", features = ["test-util"] }
bytes.workspace = true
serde_json.workspace = true
http-body-util = "0.1"
minijinja-autoreload = "2.5.0"  # Development-only template reloading
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid", "macros"] }

[build-dependencies]
minijinja-embed.workspace = true
time = { workspace = true, features = ["formatting"] }

[patch.crates-io]
tower-sessions-sqlx-store = { path = "vendor/tower-sessions-sqlx-store" }
