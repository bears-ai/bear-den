name: Documentation links

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test documentation checks
        run: python3 -m unittest discover -s tests/docs -p 'test_*.py'
      - name: Check new broken links and duplicate ADR identifiers
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$DOCS_BASE"
          python3 scripts/check-docs.py --base "$DOCS_BASE"
