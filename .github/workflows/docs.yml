name: Documentation guard

on:
  pull_request:
  push:
    branches: [main, test]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test documentation guard
        run: python3 -m unittest discover -s tests/docs -p 'test_*.py'
      - name: Block newly broken documentation links and unindexed pages
        env:
          DOCS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${DOCS_BASE}^{commit}" 2>/dev/null; then
            DOCS_BASE="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check-docs.py --base "$DOCS_BASE" --impact
